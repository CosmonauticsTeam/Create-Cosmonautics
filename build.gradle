plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '9.4.3'
}

configurations {
    shade
    implementation.extendsFrom(shade)
    jarExtraction
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        name = "create maven"
        url = "https://maven.createmod.net/"
    }

    maven {
        url = "https://maven.blamejared.com/"
    }

    maven {
        url = "https://maven.squiddev.cc/"
    }

    maven {
        url = "https://maven.covers1624.net/"
    }

    maven {
        url = "https://maven.ryanhcode.dev/releases"
    }

    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

def devUsername = "Dev${new Random().nextInt(10000)}"

def getCalVer() {
    try {
        def process = new ProcessBuilder('git', 'rev-list', '--count', 'HEAD')
            .directory(projectDir)
            .redirectErrorStream(true)
            .start()
        process.waitFor()
        def commitCount = process.inputStream.text.trim()
        def dateStr = new java.text.SimpleDateFormat("yy.MM").format(new java.util.Date())
        return "${dateStr}.${commitCount}"
    } catch (Exception e) {
        println "CalVer Exception: " + e
        return project.hasProperty('mod_version') ? project.mod_version : "26.07.0"
    }
}

version = getCalVer()
group = 'dev.devce.rocketnautics'

base {
    archivesName = 'cosmonautics'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.228'

    runs {
        client {
            client()
            programArguments.addAll '--username', devUsername
            systemProperty 'neoforge.enabledGameTestNamespaces', 'rocketnautics'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.shade)
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'rocketnautics'
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.shade)
        }

        data {
            data()
            programArguments.addAll '--mod', project.name, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.shade)
        }
    }

    mods {
        rocketnautics {
            sourceSet sourceSets.main
        }
    }
}

tasks.register('extractInnerJar', Copy) {
    // Take the downloaded outer JAR file and treat it as a zip tree
    from {
        configurations.jarExtraction.collect { zipTree(it) }
    }
    // Filter specifically for your nested JAR file
    include "**/c2me-neoforge-opts-dfc-mc1.21.1-${c2me_version}.jar"

    // Flatten the directory structure so it drops straight into our target folder
    eachFile { path = name }
    includeEmptyDirs = false

    into layout.buildDirectory.dir("extracted-jars")
}

dependencies {

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    jarJar(api("com.tterrag.registrate:Registrate:$registrate_version"))

    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.tterrag.registrate', module: 'Registrate'
    }
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    implementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_version}") { transitive = false }
    implementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") { transitive = false }
    implementation("foundry.veil:veil-neoforge-${minecraft_version}:4.1.1")

    runtimeOnly("maven.modrinth:c2me-neoforge:${c2me_version}+1.21.1")
    jarExtraction("maven.modrinth:c2me-neoforge:${c2me_version}+1.21.1")
    compileOnly fileTree(layout.buildDirectory.dir("extracted-jars")) {
        builtBy(extractInnerJar)
    }

    compileOnly("mezz.jei:jei-1.21.1-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:${jei_version}")

    implementation "curse.maven:jade-324717:6738687"


    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}")
    runtimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")

    shade("org.luaj:luaj-jse:3.0.1")
    shade('org.orekit:orekit:13.1.4')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// --- Fix for CreateMinecraftArtifacts missing manifest ---
// Generates an empty manifest file expected by the NeoForge moddev plugin.
tasks.register('generateDummyArtifactManifest') {
    doLast {
        def manifestFile = file("${buildDir}/moddev/nfrt_artifact_manifest.properties")
        manifestFile.parentFile.mkdirs()
        if (!manifestFile.exists()) {
            manifestFile.createNewFile()
        }
    }
}

tasks.named('createMinecraftArtifacts') {
    dependsOn tasks.named('generateDummyArtifactManifest')
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.shade]
    relocate 'org.luaj', 'dev.devce.rocketnautics.shaded.luaj'
    relocate 'org.orekit', 'dev.devce.rocketnautics.shaded.orekit'
    relocate 'org.hipparchus', 'dev.devce.rocketnautics.shaded.hipparchus'
    mergeServiceFiles()
    minimize {
        exclude("org.luaj")
    }
}

tasks.named('jar') {
    finalizedBy('shadowJar')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Implementation-Version": project.version
        ])
    }
}

artifacts {
    archives shadowJar
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Copy local mods to run/mods before runClient or runServer tasks start
tasks.register('copyLocalMods', Copy) {
    from 'localmods'
    into 'run/mods'
    include '*.jar'
    doFirst {
        println "Copying local mods from localmods/ to run/mods/..."
    }
}

tasks.configureEach { task ->
    if (task.name == 'runClient' || task.name == 'runServer') {
        task.dependsOn 'copyLocalMods'
    }
}

